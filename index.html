<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Salud Centro</h2>
    <form id="formCita">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" id="nombre" class="form-control">
            <div id="errorNombre" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="correo" class="form-label">Correo:</label>
            <input type="email" id="correo" class="form-control">
            <div id="errorCorreo" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha:</label>
            <input type="date" id="fecha" class="form-control">
            <div id="errorFecha" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="especialidad" class="form-label"> Especialidad:</label>
            <select id="especialidad" class="form-select">
                <option value="">Seleccione</option>
                <option value="Consulta general">Consulta general</option>
                <option value="Odontologia">Odontologia</option>
                <option value="Nutricion">Nutricion</option>
            </select>
            <div id="errorEspecialidad" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="horario" class="form-label">Horario:</label>
            <select id="horario" class="form-select">
                <option value="">Seleccione</option>
            </select>
            <div id="errorHorario" class="text-danger"></div>
        </div>
        <button type="submit" class="btn btn-primary">
            confirmar
        </button>
    </form>
</div>

<script src="cita.js"></script>
</body>

</html>
